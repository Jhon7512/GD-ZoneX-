<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>GD ZoneX - Loja Digital</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap\" rel=\"stylesheet\" />\n<script src=\"https://cdn.tailwindcss.com\"></script>\n<style>\n  body { background:#080b12; color:#e2e8f0; font-family:'Inter',sans-serif; margin:0; }\n  ::-webkit-scrollbar { width:10px; height:10px; }\n  ::-webkit-scrollbar-track { background:#0b0f1a; }\n  ::-webkit-scrollbar-thumb { background:#232a3d; border-radius:6px; }\n  @keyframes marquee { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }\n  .animate-marquee { animation:marquee linear infinite; width:max-content; }\n  .marquee-wrap:hover .animate-marquee { animation-play-state:paused; }\n  .line-clamp-1 { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }\n  @keyframes slidein { from{transform:translateX(100%)} to{transform:translateX(0)} }\n  .slidein { animation:slidein 300ms both; }\n  ::selection { background:rgba(34,211,238,0.35); color:white; }\n  .card-btn { opacity:0; transform:translateY(4px); transition:all .25s; }\n  .card:hover .card-btn { opacity:1; transform:translateY(0); }\n  .card img { transition:transform .5s; }\n  .card:hover img { transform:scale(1.05); }\n</style>\n</head>\n<body>\n<div id=\"app\"></div>\n\n<script>\n// ============ DATA ============\nconst IMG = {\n  smartplay: 'https://customer-assets-39nsmqrw.emergentagent.net/job_next-gen-build-6/artifacts/r7spwdcx_IMG-20260821-WA0067.jpg',\n  futmax:    'https://customer-assets-39nsmqrw.emergentagent.net/job_next-gen-build-6/artifacts/7sqzmh3h_IMG-20260821-WA0069.jpg',\n  rplay:     'https://customer-assets-39nsmqrw.emergentagent.net/job_next-gen-build-6/artifacts/zj16x3d5_IMG-20260821-WA0070.jpg',\n  stickerly: 'https://customer-assets-39nsmqrw.emergentagent.net/job_next-gen-build-6/artifacts/qahfrmso_IMG-20260821-WA0071.jpg',\n  dheart:    'https://customer-assets-39nsmqrw.emergentagent.net/job_next-gen-build-6/artifacts/ikkit19g_IMG-20260821-WA0073.jpg',\n};\n\nconst APPS = [\n  { id:'smartplay', name:'SmartPlay', image:IMG.smartplay, price:'R$ 19,90', priceNum:19.90, tagline:'Filmes, séries e canais ao vivo' },\n  { id:'fut-max',   name:'Fut Futebol Max', image:IMG.futmax, price:'R$ 24,90', priceNum:24.90, tagline:'Todos os jogos de futebol ao vivo' },\n  { id:'r-play',    name:'R Play', image:IMG.rplay, price:'R$ 14,90', priceNum:14.90, tagline:'Conteúdo exclusivo em alta qualidade' },\n  { id:'stickerly', name:'Sticker.ly', image:IMG.stickerly, price:'R$ 4,90', priceNum:4.90, tagline:'Figurinhas personalizadas ilimitadas' },\n  { id:'d-app',     name:'D — Amor & Encontros', image:IMG.dheart, price:'R$ 9,90', priceNum:9.90, tagline:'Encontre pessoas incríveis perto de você' },\n];\n\nconst CATEGORIES = [\n  { id:'streaming', name:'Streaming', count:'2+' },\n  { id:'esportes', name:'Esportes', count:'1+' },\n  { id:'entretenimento', name:'Entretenimento', count:'1+' },\n  { id:'comunicacao', name:'Comunicação', count:'1+' },\n  { id:'relacionamentos', name:'Relacionamentos', count:'1+' },\n  { id:'destaques', name:'Destaques', count:'5' },\n];\n\nconst PLANS = [\n  { id:'p30',  amount:30,  price:'R$ 19,90',  priceNum:19.90 },\n  { id:'p90',  amount:90,  price:'R$ 49,90',  priceNum:49.90 },\n  { id:'p180', amount:180, price:'R$ 89,90',  priceNum:89.90 },\n  { id:'p365', amount:365, price:'R$ 149,90', priceNum:149.90 },\n];\n\nconst REVIEWS = [\n  { name:'Lucas M.', text:'SmartPlay funcionando perfeitamente! Recebi o acesso em minutos.', date:'Há 2 dias' },\n  { name:'Ana C.',   text:'Fut Futebol Max é excelente, assisto todos os jogos sem travar.', date:'Há 5 dias' },\n  { name:'Pedro S.', text:'Loja confiável, comprei o R Play e chegou rapidinho.', date:'Há 1 semana' },\n  { name:'Julia R.', text:'Sticker.ly ativado sem problemas. Suporte muito atencioso.', date:'Há 1 semana' },\n  { name:'Rafael T.',text:'App D funcionando 100%. Recomendo demais!', date:'Há 2 semanas' },\n  { name:'Mariana L.',text:'Já comprei várias vezes. Entrega automática sensacional!', date:'Há 3 semanas' },\n];\n\n// ============ STATE ============\nlet cart = [];\nlet planSel = {};\nlet reviewPage = 0;\n\nconst fmt = n => 'R$ ' + n.toFixed(2).replace('.', ',');\nconst cartTotal = () => cart.reduce((s,i) => s + i.priceNum * i.qty, 0);\n\nfunction addToCart(item) {\n  const found = cart.find(p => p.id === item.id);\n  if (found) found.qty += (item.qty || 1);\n  else cart.push({ ...item, qty: item.qty || 1 });\n  openCart();\n  render();\n}\nfunction removeFromCart(id) { cart = cart.filter(p => p.id !== id); render(); }\nfunction updateQty(id, qty) { const it = cart.find(p => p.id === id); if (it) it.qty = Math.max(1, qty); render(); }\nfunction clearCart() { cart = []; render(); }\nfunction openCart()  { document.getElementById('cart-drawer').style.display = 'block'; }\nfunction closeCart() { document.getElementById('cart-drawer').style.display = 'none'; }\nfunction togglePlan(id, delta) { planSel[id] = Math.max(0, (planSel[id] || 0) + delta); render(); }\nfunction planTotals() {\n  let days=0, price=0;\n  PLANS.forEach(p => { const q = planSel[p.id]||0; days += q*p.amount; price += q*p.priceNum; });\n  return { days, price };\n}\nfunction addPlansToCart() {\n  PLANS.forEach(p => {\n    const q = planSel[p.id]||0;\n    if (q>0) addToCart({ id:p.id, name:`SmartPlay ${p.amount} dias`, image:IMG.smartplay, priceNum:p.priceNum, qty:q });\n  });\n  planSel = {};\n  render();\n}\nfunction setReviewPage(p) { reviewPage = p; render(); }\n\n// ============ ICONS (inline SVG) ============\nconst icon = (name, cls='w-4 h-4') => {\n  const s = 'stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke:currentColor';\n  const paths = {\n    cart:'<circle cx=\"8\" cy=\"21\" r=\"1\"/><circle cx=\"19\" cy=\"21\" r=\"1\"/><path d=\"M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12\"/>',\n    star:'<polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\" style=\"fill:currentColor\"/>',\n    users:'<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>',\n    msg:'<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/>',\n    heart:'<path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"/>',\n    shield:'<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/>',\n    zap:'<polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/>',\n    award:'<circle cx=\"12\" cy=\"8\" r=\"7\"/><polyline points=\"8.21 13.89 7 23 12 20 17 23 15.79 13.88\"/>',\n    crown:'<path d=\"M2 20h20\"/><path d=\"M5 20l-2-12 6 6 5-9 5 9 6-6-2 12\"/>',\n    ticket:'<path d=\"M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z\"/><path d=\"M13 5v14\"/>',\n    box:'<path d=\"M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"/>',\n    key:'<path d=\"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4\"/>',\n    blocks:'<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/>',\n    chev:'<polyline points=\"9 18 15 12 9 6\"/>',\n    chevL:'<polyline points=\"15 18 9 12 15 6\"/>',\n    x:'<line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/>',\n    trash:'<polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6\"/>',\n    bag:'<path d=\"M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z\"/><line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"/><path d=\"M16 10a4 4 0 0 1-8 0\"/>',\n    search:'<circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/>',\n    rocket:'<path d=\"M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z\"/><path d=\"M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z\"/>',\n    arr:'<line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/>',\n    plus:'<line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/>',\n    minus:'<line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/>',\n  };\n  return `<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" style=\"${s}\" class=\"${cls}\">${paths[name]||''}</svg>`;\n};\n\n// ============ COMPONENTS ============\nconst productCard = (p) => `\n  <div class=\"card group relative overflow-hidden rounded-xl bg-[#141a2a] border border-[#232a3d] hover:border-cyan-500/60 transition-all duration-300 hover:-translate-y-1\">\n    <div class=\"relative aspect-square overflow-hidden bg-black\">\n      <img src=\"${p.image}\" alt=\"${p.name}\" loading=\"lazy\" class=\"w-full h-full object-contain p-2\" />\n      <div class=\"absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent pointer-events-none\"></div>\n      <span class=\"absolute top-2 left-2 text-[10px] font-bold uppercase tracking-wider bg-cyan-500/90 text-slate-900 px-2 py-0.5 rounded\">Novo</span>\n    </div>\n    <div class=\"p-3\">\n      <div class=\"text-sm font-semibold text-white line-clamp-1\">${p.name}</div>\n      ${p.tagline ? `<div class=\"text-[11px] text-slate-400 line-clamp-1 mt-0.5\">${p.tagline}</div>` : ''}\n      <div class=\"flex items-center justify-between mt-2\">\n        <div class=\"text-cyan-400 font-black text-base\">${p.price}</div>\n        <button onclick='addToCart(${JSON.stringify(p)})' class=\"card-btn bg-cyan-500 hover:bg-cyan-400 text-slate-900 text-xs font-bold px-3 py-1.5 rounded-md\">Comprar</button>\n      </div>\n    </div>\n  </div>`;\n\nconst marquee = (title, items, speed) => `\n  <div class=\"max-w-7xl mx-auto px-4 sm:px-6 my-6\">\n    <div class=\"text-xs uppercase tracking-widest text-slate-500 mb-2 font-bold\">${title}</div>\n    <div class=\"marquee-wrap relative overflow-hidden py-2\">\n      <div class=\"flex gap-4 animate-marquee whitespace-nowrap\" style=\"animation-duration:${speed}s\">\n        ${[...items, ...items].map(it => `\n          <a href=\"#${it.id}\" class=\"shrink-0\">\n            <div class=\"relative w-[160px] sm:w-[200px] aspect-square rounded-xl overflow-hidden bg-[#141a2a] border border-[#232a3d] hover:border-cyan-500/60 transition-all\">\n              <img src=\"${it.image}\" alt=\"${it.name}\" loading=\"lazy\" class=\"w-full h-full object-contain p-3\" />\n              <div class=\"absolute inset-0 bg-gradient-to-t from-black/85 via-black/10 to-transparent pointer-events-none\"></div>\n              <div class=\"absolute bottom-0 left-0 right-0 p-3\">\n                <div class=\"text-xs font-semibold text-white truncate\">${it.name}</div>\n                ${it.price ? `<div class=\"text-cyan-400 font-black text-sm\">${it.price}</div>` : ''}\n              </div>\n            </div>\n          </a>`).join('')}\n      </div>\n    </div>\n  </div>`;\n\nconst sectionHeader = (title, iconName, count) => `\n  <div class=\"flex items-end justify-between mb-4 sm:mb-6\">\n    <div class=\"flex items-center gap-3\">\n      <div class=\"w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-500/20 to-blue-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400\">${icon(iconName,'w-5 h-5')}</div>\n      <h2 class=\"text-2xl sm:text-3xl font-black text-white tracking-tight\">${title}</h2>\n    </div>\n    ${count ? `<a href=\"#\" class=\"flex items-center gap-1 text-slate-400 hover:text-cyan-400 text-sm font-semibold\">Ver mais <span class=\"text-cyan-400\">${count}</span>${icon('chev','w-4 h-4')}</a>` : ''}\n  </div>`;\n\n// ============ RENDER ============\nfunction render() {\n  const totals = planTotals();\n  const totalPagesR = Math.ceil(REVIEWS.length/3);\n  const visibleRevs = REVIEWS.slice(reviewPage*3, reviewPage*3+3);\n\n  document.getElementById('app').innerHTML = `\n    <!-- TOP BAR -->\n    <a href=\"#\" class=\"block w-full bg-gradient-to-r from-[#7c3aed] via-[#6366f1] to-[#7c3aed] text-white text-center py-2 text-xs sm:text-sm font-semibold\">🎉 CLIQUE AQUI E GARANTA DESCONTOS EXCLUSIVOS!</a>\n\n    <!-- HEADER -->\n    <header class=\"sticky top-0 z-40 bg-[#0b0f1a]/95 backdrop-blur-md border-b border-[#1a1f2e]\">\n      <div class=\"max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4\">\n        <a href=\"/\" class=\"flex items-center gap-2 shrink-0\">\n          <div class=\"w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center font-black text-white shadow-lg shadow-cyan-500/20\">G</div>\n          <div class=\"leading-tight\">\n            <div class=\"text-white font-black tracking-tight text-lg\">GD<span class=\"text-cyan-400\">ZoneX</span></div>\n            <div class=\"text-[10px] text-slate-400 uppercase tracking-widest\">Digital Store</div>\n          </div>\n        </a>\n        <div class=\"hidden md:flex flex-1 max-w-md relative\">\n          <span class=\"absolute left-3 top-1/2 -translate-y-1/2 text-slate-500\">${icon('search')}</span>\n          <input type=\"text\" placeholder=\"Buscar produtos...\" class=\"w-full bg-[#141a2a] border border-[#232a3d] text-slate-200 placeholder:text-slate-500 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-cyan-500/60\" />\n        </div>\n        <nav class=\"hidden lg:flex items-center gap-1 text-sm\">\n          <a href=\"#\" class=\"px-3 py-2 text-slate-300 hover:text-cyan-400 flex items-center gap-1.5\">${icon('users')} Comunidade</a>\n          <a href=\"#\" class=\"px-3 py-2 text-slate-300 hover:text-cyan-400 flex items-center gap-1.5\">${icon('msg')} Suporte</a>\n          <a href=\"#\" class=\"px-3 py-2 text-slate-300 hover:text-cyan-400 flex items-center gap-1.5\">${icon('heart')} Afiliados</a>\n        </nav>\n        <div class=\"flex items-center gap-2\">\n          <div class=\"hidden sm:flex items-center gap-1.5 bg-[#141a2a] border border-[#232a3d] px-3 py-1.5 rounded-lg\">\n            <div class=\"flex text-emerald-400\">${[1,2,3,4,5].map(()=>icon('star','w-3.5 h-3.5')).join('')}</div>\n            <span class=\"text-xs text-slate-300 font-semibold\">Trustpilot</span>\n          </div>\n          <button onclick=\"openCart()\" class=\"relative bg-[#141a2a] border border-[#232a3d] hover:border-cyan-500/50 text-slate-200 rounded-lg px-3 py-2 flex items-center gap-2\">\n            ${icon('cart')}\n            <span class=\"hidden sm:inline text-xs font-semibold\">${fmt(cartTotal())}</span>\n            ${cart.length ? `<span class=\"absolute -top-1.5 -right-1.5 bg-cyan-500 text-[10px] font-black text-slate-900 w-5 h-5 rounded-full flex items-center justify-center\">${cart.length}</span>` : ''}\n          </button>\n        </div>\n      </div>\n    </header>\n\n    <!-- HERO -->\n    <section class=\"relative overflow-hidden\">\n      <div class=\"absolute inset-0\" style=\"background:radial-gradient(ellipse at top, rgba(34,211,238,0.12), transparent 60%)\"></div>\n      <div class=\"relative max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-16 text-center\">\n        <span class=\"inline-flex items-center gap-1 text-[11px] font-bold uppercase tracking-wider bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-full\">✨ Loja Digital 100% Segura</span>\n        <h1 class=\"mt-4 text-4xl sm:text-6xl font-black text-white tracking-tight\">Bem Vindo(a) <span style=\"background:linear-gradient(to right,#67e8f9,#22d3ee,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent\">GD ZoneX!</span></h1>\n        <p class=\"mt-4 text-slate-300 text-base sm:text-lg max-w-2xl mx-auto\">Aqui você encontra tudo para deixar sua experiência de jogo ainda melhor. Compra rápida, segura e 100% digital.</p>\n        <div class=\"mt-8 flex items-center justify-center gap-3 flex-wrap\">\n          <a href=\"#\" class=\"inline-flex items-center gap-2 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-black px-5 py-3 rounded-lg shadow-lg shadow-cyan-500/20\">${icon('heart')} Comunidade</a>\n          <a href=\"#\" class=\"inline-flex items-center gap-2 bg-[#141a2a] border border-[#232a3d] hover:border-cyan-500/50 text-slate-100 font-bold px-5 py-3 rounded-lg\">${icon('shield')} Suporte</a>\n          <a href=\"#\" class=\"inline-flex items-center gap-2 bg-[#141a2a] border border-[#232a3d] hover:border-cyan-500/50 text-slate-100 font-bold px-5 py-3 rounded-lg\">${icon('crown')} Afiliados</a>\n        </div>\n      </div>\n    </section>\n\n    ${marquee('Apps em Destaque', APPS, 45)}\n    ${marquee('Mais Vendidos', APPS, 80)}\n    ${marquee('Assinaturas em Alta', APPS, 55)}\n\n    <!-- CATEGORIAS -->\n    <section class=\"max-w-7xl mx-auto px-4 sm:px-6 py-8\">\n      ${sectionHeader('Nossas Categorias', 'box', '')}\n      <div class=\"grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3\">\n        ${CATEGORIES.map(c => `\n          <a href=\"#${c.id}\" class=\"group relative overflow-hidden rounded-xl bg-gradient-to-br from-[#141a2a] to-[#0f1420] border border-[#232a3d] hover:border-cyan-500/60 p-5 transition-all\">\n            <div class=\"absolute -top-8 -right-8 w-24 h-24 rounded-full bg-cyan-500/10 blur-2xl\"></div>\n            <div class=\"text-lg font-black text-white group-hover:text-cyan-400\">${c.name}</div>\n            ${c.count ? `<div class=\"text-xs text-slate-500 mt-1\">${c.count} produtos</div>` : ''}\n          </a>`).join('')}\n      </div>\n    </section>\n\n    <!-- APPS GRID -->\n    <section class=\"max-w-7xl mx-auto px-4 sm:px-6 py-8\">\n      ${sectionHeader('Apps em Destaque', 'crown', '5+')}\n      <div class=\"grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3\">${APPS.map(productCard).join('')}</div>\n    </section>\n\n    <!-- PLANOS SMARTPLAY -->\n    <section class=\"max-w-7xl mx-auto px-4 sm:px-6 py-8\">\n      ${sectionHeader('Planos SmartPlay', 'ticket', '4')}\n      <div class=\"grid md:grid-cols-3 gap-6\">\n        <div class=\"md:col-span-1 rounded-xl overflow-hidden bg-gradient-to-br from-red-900/40 to-slate-900/40 border border-[#232a3d] p-6 flex flex-col justify-center items-center text-center\">\n          <img src=\"${IMG.smartplay}\" alt=\"SmartPlay\" class=\"w-32 h-32 object-contain rounded-xl\" />\n          <div class=\"text-3xl font-black text-white mt-3\">SmartPlay</div>\n          <div class=\"text-slate-300 text-sm mt-1\">Escolha o plano ideal.</div>\n        </div>\n        <div class=\"md:col-span-2 rounded-xl bg-[#141a2a] border border-[#232a3d] p-5\">\n          <div class=\"text-white font-black text-lg mb-3\">Planos</div>\n          <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n            ${PLANS.map(p => `\n              <div class=\"bg-[#0b0f1a] border border-[#232a3d] rounded-lg p-3 flex flex-col items-center\">\n                <div class=\"text-2xl font-black text-cyan-400\">${p.amount}</div>\n                <div class=\"text-[10px] uppercase tracking-widest text-slate-500\">Dias</div>\n                <div class=\"text-sm font-bold text-white mt-1\">${p.price}</div>\n                <div class=\"flex items-center gap-2 mt-2\">\n                  <button onclick=\"togglePlan('${p.id}',-1)\" class=\"w-7 h-7 rounded bg-[#141a2a] border border-[#232a3d] text-slate-300\">-</button>\n                  <span class=\"w-6 text-center text-slate-200 text-sm font-bold\">${planSel[p.id]||0}</span>\n                  <button onclick=\"togglePlan('${p.id}',1)\" class=\"w-7 h-7 rou
